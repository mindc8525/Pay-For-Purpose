<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="100%" height="100%">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Card Background -->
  <rect x="20" y="20" width="760" height="520" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#shadow)" />

  <!-- Header Banner -->
  <path d="M 20 36 Q 20 20 36 20 L 764 20 Q 780 20 780 36 L 780 110 L 20 110 Z" fill="url(#headerGrad)" />
  
  <text x="50" y="60" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" letter-spacing="1">PAR FOR PURPOSE • OFFICIAL SCORECARD</text>
  <text x="50" y="85" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">WORLD HANDICAP SYSTEM (WHS) ATTESTED COMPETITION ROUND</text>

  <!-- Attestation Badge -->
  <g transform="translate(620, 38)">
    <rect width="130" height="50" rx="8" fill="#022c22" fill-opacity="0.6" stroke="#34d399" stroke-width="1.5" />
    <text x="65" y="22" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" text-anchor="middle" letter-spacing="1">VERIFIED ROUND</text>
    <text x="65" y="38" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">OFFICIAL ATTESTED</text>
  </g>

  <!-- Player Meta Info -->
  <rect x="45" y="130" width="710" height="70" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
  
  <text x="65" y="155" fill="#64748b" font-family="sans-serif" font-size="10" font-weight="700" letter-spacing="0.5">PLAYER NAME</text>
  <text x="65" y="180" fill="#0f172a" font-family="sans-serif" font-size="15" font-weight="800">Jordan Spieth</text>

  <text x="230" y="155" fill="#64748b" font-family="sans-serif" font-size="10" font-weight="700" letter-spacing="0.5">MEMBER ID</text>
  <text x="230" y="180" fill="#0f172a" font-family="sans-serif" font-size="15" font-weight="700">#PFP-88421</text>

  <text x="370" y="155" fill="#64748b" font-family="sans-serif" font-size="10" font-weight="700" letter-spacing="0.5">DATE OF ROUND</text>
  <text x="370" y="180" fill="#0f172a" font-family="sans-serif" font-size="15" font-weight="700">2026-02-28</text>

  <text x="510" y="155" fill="#64748b" font-family="sans-serif" font-size="10" font-weight="700" letter-spacing="0.5">HANDICAP INDEX</text>
  <text x="510" y="180" fill="#047857" font-family="sans-serif" font-size="16" font-weight="800">+2.4</text>

  <text x="640" y="155" fill="#64748b" font-family="sans-serif" font-size="10" font-weight="700" letter-spacing="0.5">STABLEFORD</text>
  <text x="640" y="180" fill="#047857" font-family="sans-serif" font-size="18" font-weight="900">41 PTS</text>

  <!-- Scorecard Table -->
  <g transform="translate(45, 220)">
    <!-- Header Row -->
    <rect x="0" y="0" width="710" height="30" fill="#0f172a" rx="6" />
    <text x="40" y="20" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold">HOLE</text>
    <text x="95" y="20" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold">1</text>
    <text x="135" y="20" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold">2</text>
    <text x="175" y="20" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold">3</text>
    <text x="215" y="20" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold">4</text>
    <text x="255" y="20" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold">5</text>
    <text x="295" y="20" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold">6</text>
    <text x="335" y="20" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold">7</text>
    <text x="375" y="20" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold">8</text>
    <text x="415" y="20" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold">9</text>
    <text x="465" y="20" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">OUT</text>
    <text x="525" y="20" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">IN</text>
    <text x="590" y="20" fill="#a7f3d0" font-family="monospace" font-size="11" font-weight="bold">TOTAL</text>
    <text x="660" y="20" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold">PTS</text>

    <!-- Par Row -->
    <rect x="0" y="32" width="710" height="26" fill="#f1f5f9" />
    <text x="40" y="50" fill="#64748b" font-family="monospace" font-size="11" font-weight="bold">PAR</text>
    <text x="95" y="50" fill="#334155" font-family="monospace" font-size="11">4</text>
    <text x="135" y="50" fill="#334155" font-family="monospace" font-size="11">4</text>
    <text x="175" y="50" fill="#334155" font-family="monospace" font-size="11">3</text>
    <text x="215" y="50" fill="#334155" font-family="monospace" font-size="11">5</text>
    <text x="255" y="50" fill="#334155" font-family="monospace" font-size="11">4</text>
    <text x="295" y="50" fill="#334155" font-family="monospace" font-size="11">4</text>
    <text x="335" y="50" fill="#334155" font-family="monospace" font-size="11">3</text>
    <text x="375" y="50" fill="#334155" font-family="monospace" font-size="11">5</text>
    <text x="415" y="50" fill="#334155" font-family="monospace" font-size="11">4</text>
    <text x="465" y="50" fill="#0f172a" font-family="monospace" font-size="11" font-weight="bold">36</text>
    <text x="525" y="50" fill="#0f172a" font-family="monospace" font-size="11" font-weight="bold">36</text>
    <text x="590" y="50" fill="#0f172a" font-family="monospace" font-size="11" font-weight="bold">72</text>
    <text x="660" y="50" fill="#64748b" font-family="monospace" font-size="11">36</text>

    <!-- Score Row -->
    <rect x="0" y="60" width="710" height="30" fill="#e0f2fe" />
    <text x="40" y="80" fill="#0369a1" font-family="monospace" font-size="11" font-weight="bold">SCORE</text>
    <text x="95" y="80" fill="#0f172a" font-family="monospace" font-size="12" font-weight="bold">3</text>
    <text x="135" y="80" fill="#0f172a" font-family="monospace" font-size="12" font-weight="bold">4</text>
    <text x="175" y="80" fill="#0f172a" font-family="monospace" font-size="12" font-weight="bold">3</text>
    <text x="215" y="80" fill="#0f172a" font-family="monospace" font-size="12" font-weight="bold">4</text>
    <text x="255" y="80" fill="#0f172a" font-family="monospace" font-size="12" font-weight="bold">4</text>
    <text x="295" y="80" fill="#0f172a" font-family="monospace" font-size="12" font-weight="bold">3</text>
    <text x="335" y="80" fill="#0f172a" font-family="monospace" font-size="12" font-weight="bold">2</text>
    <text x="375" y="80" fill="#0f172a" font-family="monospace" font-size="12" font-weight="bold">4</text>
    <text x="415" y="80" fill="#0f172a" font-family="monospace" font-size="12" font-weight="bold">4</text>
    <text x="465" y="80" fill="#0369a1" font-family="monospace" font-size="12" font-weight="bold">31</text>
    <text x="525" y="80" fill="#0369a1" font-family="monospace" font-size="12" font-weight="bold">36</text>
    <text x="590" y="80" fill="#047857" font-family="monospace" font-size="14" font-weight="900">67</text>
    <text x="660" y="80" fill="#047857" font-family="monospace" font-size="14" font-weight="900">41</text>
  </g>

  <!-- Club Verification Seal & Signatures -->
  <g transform="translate(45, 360)">
    <rect x="0" y="0" width="450" height="120" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4 4" />
    <text x="20" y="30" fill="#334155" font-family="sans-serif" font-size="12" font-weight="bold">Attested by Marker &amp; Club Professional</text>
    <text x="20" y="55" fill="#64748b" font-family="sans-serif" font-size="11">Marker: David Duval (#PGA-44102)</text>
    <text x="20" y="75" fill="#64748b" font-family="sans-serif" font-size="11">Course: Royal Melbourne Golf Club - Championship Course</text>
    <text x="20" y="98" fill="#047857" font-family="monospace" font-size="11" font-weight="bold">Attestation Hash: 9e4a8b1c73f290d14ea</text>

    <!-- Digital Stamp -->
    <g transform="translate(500, 5)">
      <circle cx="80" cy="55" r="50" fill="none" stroke="#047857" stroke-width="2.5" stroke-dasharray="6 3" />
      <circle cx="80" cy="55" r="42" fill="#ecfdf5" />
      <text x="80" y="45" fill="#065f46" font-family="sans-serif" font-size="9" font-weight="900" text-anchor="middle" letter-spacing="1">VERIFIED</text>
      <text x="80" y="60" fill="#047857" font-family="sans-serif" font-size="12" font-weight="900" text-anchor="middle">APPROVED</text>
      <text x="80" y="72" fill="#065f46" font-family="sans-serif" font-size="8" font-weight="bold" text-anchor="middle">2026-02-28</text>
    </g>
  </g>

  <!-- Footer Notice -->
  <text x="400" y="520" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">
    Official digital proof certified by Par For Purpose Golf Oversight Committee. Compliant with USGA / R&amp;A Rules.
  </text>
</svg>
